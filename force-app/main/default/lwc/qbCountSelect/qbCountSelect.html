<template>
    <div class="qb-count-select">
        <div class="qb-count-card">
            <p class="qb-count-title">{certificationName}</p>
            <p class="qb-count-subtitle">{modeLabel} · 전체 {totalCount}문제 중 몇 문제를 풀까요?</p>

            <lightning-input
                type="number"
                label="문항 수"
                min="1"
                max={totalCount}
                value={count}
                onchange={handleChange}
                class="qb-count-input">
            </lightning-input>

            <div class="qb-quick-options">
                <template for:each={quickOptions} for:item="opt">
                    <button key={opt} class="qb-quick-chip" data-value={opt} onclick={handleQuickSelect}>{opt}문제</button>
                </template>
            </div>

            <p class="qb-filter-title">정답 유형 필터 (선택 안 하면 전체에서 랜덤)</p>
            <div class="qb-filter-options">
                <lightning-input
                    type="checkbox"
                    label="단일 정답 문제만"
                    checked={filterSingle}
                    onchange={handleToggleSingle}>
                </lightning-input>
                <lightning-input
                    type="checkbox"
                    label="다수 정답 문제만"
                    checked={filterMultiple}
                    onchange={handleToggleMultiple}>
                </lightning-input>
            </div>

            <div class="qb-count-actions">
                <lightning-button label="시작하기" variant="brand" disabled={isStartDisabled} onclick={handleStart}></lightning-button>
            </div>
        </div>
    </div>
</template>
