<template>
    <div class="qb-runner">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="문제를 불러오는 중"></lightning-spinner>
        </template>

        <template if:true={error}>
            <div class="slds-text-color_error">문제를 불러오지 못했습니다.</div>
        </template>

        <template if:false={isFinished}>
            <template if:true={currentQuestion}>
                <div class="qb-runner-body">
                    <div class="qb-progress-bar">
                        <span class="qb-progress-label">{progressLabel}</span>
                        <template if:true={currentQuestion.topic}>
                            <lightning-badge label={currentQuestion.topic}></lightning-badge>
                        </template>
                    </div>

                    <p class="qb-run-question-text">{currentQuestion.text}</p>

                    <ul class="qb-run-options">
                        <template for:each={currentQuestion.options} for:item="opt">
                            <li key={opt.key} class={opt.optionClass} data-key={opt.key} onclick={handleSelectOption}>
                                <span class="qb-run-option-key">{opt.key}</span>
                                <span class="qb-run-option-label">{opt.label}</span>
                            </li>
                        </template>
                    </ul>
                </div>

                <div class="qb-runner-footer">
                    <template if:true={endHint}>
                        <p class="qb-end-hint">{endHint}</p>
                    </template>

                    <div class="qb-footer-row">
                        <lightning-button-icon
                            icon-name="utility:chevronleft"
                            alternative-text="이전 문제"
                            variant="border-filled"
                            size="small"
                            disabled={isFirst}
                            onclick={handlePrev}>
                        </lightning-button-icon>

                        <div class="qb-jump-wrapper">
                            <template if:true={isJumpOpen}>
                                <div class="qb-jump-backdrop" onclick={handleCloseJump}></div>
                            </template>
                            <button class="qb-jump-trigger" onclick={handleToggleJump}>{progressLabel}</button>
                            <div class={jumpPanelClass}>
                                <template for:each={questionOptions} for:item="opt">
                                    <button
                                        key={opt.value}
                                        class={opt.itemClass}
                                        data-index={opt.value}
                                        onclick={handleJumpSelect}>
                                        {opt.number}
                                        <template if:true={opt.showAnswered}>
                                            <span class="qb-jump-check">✓</span>
                                        </template>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <lightning-button-icon
                            icon-name="utility:chevronright"
                            alternative-text="다음 문제"
                            variant="border-filled"
                            size="small"
                            disabled={isLast}
                            onclick={handleNext}>
                        </lightning-button-icon>
                    </div>

                    <div class="qb-footer-row qb-footer-actions">
                        <button class="qb-action-btn" onclick={handleCheckAnswer}>{currentQuestion.checkAnswerLabel}</button>
                        <button class="qb-action-btn qb-action-end" disabled={isEndDisabled} onclick={handleEnd}>{endLabel}</button>
                    </div>
                </div>
            </template>
        </template>

        <template if:true={isFinished}>
            <div class="qb-finish-panel">
                <h2 class="qb-finish-title">{endLabel} 완료</h2>
                <template if:true={isMock}>
                    <p class="qb-finish-score">{score.correct} / {score.total} 정답</p>
                </template>
                <div class="qb-finish-actions">
                    <lightning-button label="다시 풀기" onclick={handleRestart}></lightning-button>
                    <lightning-button label="목록으로" variant="brand" onclick={handleBack}></lightning-button>
                </div>

                <template if:true={hasWrongQuestions}>
                    <div class="qb-wrong-review">
                        <p class="qb-wrong-review-title">틀린 문제 ({wrongCount}개)</p>
                        <template for:each={wrongQuestions} for:item="q">
                            <div key={q.id} class="qb-wrong-card">
                                <p class="qb-run-question-text">
                                    <span class="qb-wrong-number">Q{q.number}.</span> {q.text}
                                </p>
                                <template if:true={q.topic}>
                                    <lightning-badge label={q.topic}></lightning-badge>
                                </template>
                                <ul class="qb-run-options">
                                    <template for:each={q.options} for:item="opt">
                                        <li key={opt.key} class={opt.optionClass}>
                                            <span class="qb-run-option-key">{opt.key}</span>
                                            <span class="qb-run-option-label">{opt.label}</span>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
